[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rava-auction"
version = "1.0.0"
description = "RAVA: Reciprocal Adaptive Value and Resource Allocation Auction for reliability-aware GPU and cloud clusters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59", "pandas>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rava = "rava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running reproduction tests"]
